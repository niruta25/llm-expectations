# Two jobs, wired separately.
#
# Triage ranks every note for a human to work down. The gated claim judge
# only sees the notes a free check flagged, plus an audit sample — that is
# what makes a free-text field cheaper to check than an assigned one, which
# is the opposite of what you would guess.
#
# The panel measures the `area` label. It has no opinion on the notes: there
# is no single right release note, so three judges agreeing about one would
# be measuring house style.

judges:
  - id: judge-a
    provider: anthropic
    model: claude-sonnet-5
    api_key_env: ANTHROPIC_API_KEY     # the NAME of the variable, never the key
    temperature: 0
    max_tokens: 60

  - id: judge-b
    provider: anthropic
    model: claude-opus-5
    api_key_env: ANTHROPIC_API_KEY

  - id: judge-c
    provider: anthropic
    model: claude-haiku-4-5
    api_key_env: ANTHROPIC_API_KEY

panel:
  members: [judge-a, judge-b, judge-c]
  sample: 130

triage:
  judge: judge-a
  scope: all
  strategy: auto
  budgets: [0.01, 0.05, 0.10, 0.20]
