# The same project, wired to a scripted judge so it runs with no API key
# and no cost. See judges-offline.yml for what that means and does not mean.
#
#   llm-expectations run examples/jtbd/run-offline.yml
#
run_id: jtbd-p8                  # a timestamp is added automatically

items:    items.jsonl
outputs:  outputs.jsonl
labels:   labels.jsonl
schema:   schema.yml
taxonomy: [taxonomy.yml, outcomes.yml]
judges:   judges-offline.yml
settings: settings.yml

produced_by:
  model: claude-sonnet-5
  prompt_version: p8

budget:
  max_usd: 5.00
  confirm: true
