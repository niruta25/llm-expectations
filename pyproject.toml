[project]
name = "llm-expectations"
version = "0.0.0"
description = "Quality checks for LLM outputs that are judgements about a document, not values copied out of one"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["llm", "evaluation", "llm-as-judge", "classification", "taxonomy", "data-quality"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]

# One per milestone that needs it, not one list up front. M0 reads config, so
# it takes pyyaml; M1 makes the first provider call, so it takes httpx; M4
# resamples a thousand times per interval, so it takes numpy. See DESIGN.md §12.
dependencies = ["pyyaml>=6", "httpx>=0.27", "numpy>=1.24"]

[project.optional-dependencies]
# Input readers beyond jsonl/csv. Not needed by the core path.
frames = ["pandas>=2", "pyarrow>=15"]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6",
]

[project.scripts]
llm-expectations = "llm_expectations.cli:main"

[project.urls]
Homepage = "https://github.com/niruta25/llm-expectations"
Design = "https://github.com/niruta25/llm-expectations/blob/main/DESIGN.md"

[tool.setuptools.packages.find]
include = ["llm_expectations*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
# S101 asserts are the point of a test file; S311 pseudo-random is not crypto.
"tests/*" = ["S101", "S311"]

[tool.mypy]
strict = true
files = ["llm_expectations"]

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "raise NotImplementedError", "\\.\\.\\."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
