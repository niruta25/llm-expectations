name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The guards below keep CI green before M0 lands and make every step
      # meaningful the moment the package and tests exist. Remove them once
      # llm_expectations/ and tests/ are both present.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if [ -d llm_expectations ]; then
            pip install -e ".[dev]"
          else
            pip install ruff mypy pytest
          fi

      - name: Lint
        run: ruff check .

      - name: Typecheck
        run: |
          if [ -d llm_expectations ]; then
            mypy llm_expectations
          else
            echo "no package yet — skipping"
          fi

      - name: Test
        run: |
          if [ -d tests ]; then
            pytest -q --cov=llm_expectations --cov-report=term-missing
          else
            echo "no tests yet — skipping"
          fi
